name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.3
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
          skip: lean-axioms
      - name: Git whitespace
        run: git diff --check
      - name: Validate README artwork
        run: python3 -c 'import pathlib, xml.etree.ElementTree as ET; [ET.parse(path) for path in pathlib.Path("assets").glob("*.svg")]'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - name: Fetch private ecosystem dependencies
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .lake/packages
          if [ ! -d .lake/packages/grip/.git ]; then
            git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/jonaprieto/lean-grip.git" \
              .lake/packages/grip
          fi
          if [ ! -d .lake/packages/termcolor-diagnostics/.git ]; then
            git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/jonaprieto/lean-termcolor-diagnostics.git" \
              .lake/packages/termcolor-diagnostics
          fi
          if [ ! -d .lake/packages/termcolor-layout/.git ]; then
            git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/jonaprieto/lean-termcolor-layout.git" \
              .lake/packages/termcolor-layout
          fi
          if [ ! -d .lake/packages/termcolor/.git ]; then
            git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/jonaprieto/lean-termcolor.git" \
              .lake/packages/termcolor
          fi
          manifest_rev() {
            python3 - "$1" <<'PY'
          import json
          import sys

          url = sys.argv[1]
          for package in json.load(open("lake-manifest.json"))["packages"]:
              if package["url"] == url:
                  print(package["rev"])
                  break
          else:
              raise SystemExit(f"missing manifest entry: {url}")
          PY
          }
          GRIP_REV="$(manifest_rev 'https://github.com/jonaprieto/lean-grip.git')"
          DIAGNOSTICS_REV="$(manifest_rev 'https://github.com/jonaprieto/lean-termcolor-diagnostics.git')"
          LAYOUT_REV="$(manifest_rev 'https://github.com/jonaprieto/lean-termcolor-layout.git')"
          TERMCOLOR_REV="$(manifest_rev 'https://github.com/jonaprieto/lean-termcolor.git')"
          git -C .lake/packages/grip fetch --depth=1 origin \
            "${GRIP_REV}"
          git -C .lake/packages/termcolor-diagnostics fetch --depth=1 origin \
            "${DIAGNOSTICS_REV}"
          git -C .lake/packages/termcolor-layout fetch --depth=1 origin \
            "${LAYOUT_REV}"
          git -C .lake/packages/termcolor fetch --depth=1 origin \
            "${TERMCOLOR_REV}"
          git -C .lake/packages/grip checkout --detach \
            "${GRIP_REV}"
          git -C .lake/packages/termcolor-diagnostics checkout --detach \
            "${DIAGNOSTICS_REV}"
          git -C .lake/packages/termcolor-layout checkout --detach \
            "${LAYOUT_REV}"
          git -C .lake/packages/termcolor checkout --detach \
            "${TERMCOLOR_REV}"
      - uses: leanprover/lean-action@v1
        with:
          build-args: "GripDiagnostics GripDiagnostics.Properties tests demo readme"
      - name: Run tests
        run: ./.lake/build/bin/tests
      - name: Verify README examples
        run: ./.lake/build/bin/readme >/dev/null
      - name: Render demo gallery
        run: ./.lake/build/bin/demo >/dev/null
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.3
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
          hooks: lean-axioms
